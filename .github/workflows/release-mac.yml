name: Release (Mac)

# Manual trigger only — run this after a version bump to build, sign, notarize,
# and publish the Mac installer to the matching GitHub Release. Mirrors
# release-windows.yml so both platforms auto-update from the same tag.
on:
  workflow_dispatch:

permissions:
  contents: write # required so electron-builder can upload release assets

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build:ts

      - name: Write App Store Connect API key to disk
        # notarize.js (afterSign hook) needs APPLE_API_KEY as a file path, not
        # raw content — decode the base64 secret into a .p8 file for it to read.
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Import signing certificate into a build keychain
        # Oct 2026: electron-builder's own temporary keychain stopped unlocking on
        # the macos-26 runner image ("SecKeychainUnlock: The user name or
        # passphrase you entered is not correct" in set-key-partition-list), so
        # the certificate goes into a keychain made here, with a known password,
        # and electron-builder finds the identity in it (CSC_LINK left unset).
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KPASS="$(openssl rand -hex 24)"
          security create-keychain -p "$KPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPASS" "$KEYCHAIN"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, sign, notarize, and publish Mac installer
        run: npx --no-install electron-builder --mac --publish always
        env:
          # CSC_LINK accepts base64-encoded .p12 content directly (electron-builder
          # decodes it into a temporary keychain) — no manual keychain import needed.
          # Signing identity comes from the keychain imported above.
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # electron-builder's github publisher authenticates with GH_TOKEN.
          # The default GITHUB_TOKEN can edit releases in this repo (contents: write).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up API key and keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/private_keys/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
